name: Release Controller

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

env:
  ACR_REGISTRY_NAME: containerbutler # example: "myRegistry" .azurecr.io
  ACR_REPO_NAME: ${{ github.event.repository.name }} # example: myRepo
  KEY_ID: ${{ secrets.ACR_KEY_ID }} # example: https://mynotationakv.vault.azure.net/keys/notationLeafCert/c585b8ad8fc542b28e41e555d9b3a1fd
  NOTATION_EXPERIMENTAL: 1 # [Optional] when set, use Referrers API in the workflow (Recommended)

jobs:
  goreleaser:
    permissions:
      contents: write
      id-token: write
      security-events: write
      packages: write
    runs-on: ubuntu-latest
    name: GoReleaser build, push to GHCR/DockerHub/ACR/GAR/ECR, & sign with cosign/notation
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Free disk space
        run: |
          echo "Disk before cleanup:"
          df -h

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/node
          sudo rm -rf /opt/hostedtoolcache/Python
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/microsoft
          sudo rm -rf /opt/google

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo journalctl --vacuum-time=1s || true

          echo "Large directories after cleanup:"
          sudo du -xh /usr /opt /var 2>/dev/null | sort -h | tail -50

          echo "Disk after cleanup:"
          df -h
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          check-latest: true
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm,arm64,s390x,ppc64le,riscv64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: butlergroup
          password: ${{ secrets.DOCKER_PASSWORD }}
      # Log in to Azure with your service principal
      - name: Azure login
        uses: Azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      # Log in to your ACR registry
      - name: Login to Azure Container Registry (Docker)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: containerbutler.azurecr.io
          username: ${{ secrets.AZURE_CREDENTIALS_CLIENT_ID }}
          password: ${{ secrets.AZURE_CREDENTIALS_CLIENT_SECRET }}
      - name: Authenticate to Google Cloud
        uses: "google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093" # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Set up gCloud SDK
        uses: "google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db" # v3.0.1
      - name: Configure gcloud Docker for GAR
        run: |
          gcloud auth configure-docker \
            us-docker.pkg.dev,gcr.io \
            --quiet
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Login to Amazon ECR
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            echo "ECR login attempt $attempt"

            if aws ecr get-login-password \
              --region "us-east-1" | \
              docker login \
                --username AWS \
                --password-stdin \
                "709825985650.dkr.ecr.us-east-1.amazonaws.com"; then
              echo "ECR login succeeded"
              exit 0
            fi

            echo "ECR login failed; retrying..."
            sleep $((attempt * 5))
          done

          echo "ECR login failed after retries"
          exit 1
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 #v4.1.2
      - name: Check install!
        run: cosign version
      # Install Notation CLI with the default version "1.0.0"
      - name: setup notation
        uses: notaryproject/notation-action/setup@b6fee73110795d6793253c673bd723f12bcf9bbb # v1.2.2
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: docker.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          format: "sarif"
          output: "trivy-results.sarif"
          # exit-code: 1 # fail the workflow if vulnerabilities are found
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: "trivy-results.sarif"
      - name: Get GoReleaser digest and sign GHCR, DockerHub, GAR, & ECR images
        run: |
          echo "==== dist/digests.txt ===="
          cat dist/digests.txt
          DIGEST_RAW=$(grep "ghcr.io" dist/digests.txt | head -n1 | awk '{print $1}')
          if [ -z "$DIGEST_RAW" ]; then
            echo "ERROR: Digest not found!"
            exit 1
          fi
          DIGEST="sha256:${DIGEST_RAW}"
          GHCR_IMAGE="ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}"
          DOCKERHUB_IMAGE="docker.io/${{ github.repository_owner }}/${{ github.event.repository.name }}"
          GAR_IMAGE="us-docker.pkg.dev/containerbutler/caddy-ingress/${{ github.event.repository.name }}"
          echo "Using digest: $DIGEST"
          echo "target_artifact_reference=containerbutler.azurecr.io/${{ env.ACR_REPO_NAME }}@$DIGEST" >> "$GITHUB_ENV"
          echo "Signing GHCR image: ${GHCR_IMAGE}@${DIGEST}"
          cosign sign --yes ${GHCR_IMAGE}@${DIGEST}
          echo "Signing DockerHub image: ${DOCKERHUB_IMAGE}@${DIGEST}"
          cosign sign --yes ${DOCKERHUB_IMAGE}@${DIGEST}
          echo "Signing GAR image: ${GAR_IMAGE}@${DIGEST}"
          cosign sign --yes ${GAR_IMAGE}@${DIGEST}
      - name: GHCR retention policy
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: caddy-ingress
          package-type: container
          min-versions-to-keep: 81
      - name: Get runner public IP
        id: ip
        run: echo "ip=$(curl -s https://api.ipify.org)" >> "$GITHUB_OUTPUT"
      - name: Allow runner IP in Key Vault
        run: |
          az keyvault network-rule add \
            --name computerbutler-keyvault \
            --resource-group computerbutler \
            --ip-address ${{ steps.ip.outputs.ip }}
      # Sign your ACR OCI artifact using private key stored in AKV
      - name: sign ACR artifact using key pair from AKV
        uses: notaryproject/notation-action/sign@b6fee73110795d6793253c673bd723f12bcf9bbb # v1.2.2
        with:
          plugin_name: azure-kv
          plugin_url: https://github.com/Azure/notation-azure-kv/releases/download/v1.2.1/notation-azure-kv_1.2.1_linux_amd64.tar.gz
          plugin_checksum: 67c5ccaaf28dd44d2b6572684d84e344a02c2258af1d65ead3910b3156d3eaf5
          key_id: ${{ env.KEY_ID }}
          target_artifact_reference: ${{ env.target_artifact_reference }}
          signature_format: cose
          plugin_config: |-
            self_signed=true
          # If you are using self-signed certificate from AKV, then the `plugin_config` should be:
          # plugin_config: |-
          #   self_signed=true
          # ca_certs=.github/cert-bundle/cert-bundle.crt
          force_referrers_tag: "true"
      - name: Remove runner IP from Key Vault
        run: |
          az keyvault network-rule remove \
            --name computerbutler-keyvault \
            --resource-group computerbutler \
            --ip-address ${{ steps.ip.outputs.ip }}
      - name: Extract current Helm chart version
        id: chart
        run: |
          VERSION=$(grep '^version:' charts/caddy-ingress-controller/Chart.yaml | awk '{print $2}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Generate azureManifest.yaml
        run: |
          sed \
            -e "s/__VERSION__/${{ steps.chart.outputs.version }}/g" \
            azureManifest.yaml.tpl > manifest.yaml
      - name: Enable CNAB image source
        run: |
          yq -i '.cnab.enabled = true' charts/caddy-ingress-controller/values.yaml
      - name: Build CNAB Bundle and Publish to ACR
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4; do
            echo "CNAB publish attempt $attempt"

            if docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${{ github.workspace }}:/data" \
              -v /home/runner/.docker:/root/.docker \
              --entrypoint "/bin/bash" \
              mcr.microsoft.com/container-package-app:latest \
              -c "cd /data && cpa buildbundle --force"; then
              echo "CNAB publish succeeded"
              exit 0
            fi

            echo "CNAB publish failed; retrying..."
            sleep $((attempt * 1))
          done

          echo "CNAB publish failed after retries"
          exit 1
      - name: Extract GCP Marketplace major.minor version without patch
        id: marketplace-version
        shell: bash
        run: |
          set -euo pipefail

          FULL_VERSION="${{ github.ref_name }}"

          MARKETPLACE_VERSION="$(cut -d. -f1,2 <<< "$FULL_VERSION").0"

          echo "marketplace_version=$MARKETPLACE_VERSION" >> "$GITHUB_OUTPUT"

          echo "Marketplace version: $MARKETPLACE_VERSION"
      - name: Build and push GCP Marketplace deployer image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./deployer/Dockerfile
          build-args: |
            CHART_NAME=caddy-ingress-controller
            REGISTRY=us-docker.pkg.dev/containerbutler/caddy-ingress
            TAG=${{ steps.marketplace-version.outputs.marketplace_version }}
          push: true
          provenance: false
          sbom: false
          tags: |
            us-docker.pkg.dev/containerbutler/caddy-ingress/deployer:${{ steps.marketplace-version.outputs.marketplace_version }}
          annotations: |
            com.googleapis.cloudmarketplace.product.service.name=services/caddy-k8s-ingress-controller-k8s-app.endpoints.containerbutler.cloud.goog
      - name: Build and push GCP Marketplace tester image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./apptest/tester
          file: ./apptest/tester/Dockerfile
          push: true
          provenance: false
          sbom: false
          tags: |
            us-docker.pkg.dev/containerbutler/caddy-ingress/tester:${{ steps.marketplace-version.outputs.marketplace_version }}
          annotations: |
            com.googleapis.cloudmarketplace.product.service.name=services/caddy-k8s-ingress-controller-k8s-app.endpoints.containerbutler.cloud.goog
      - name: Multi-registry retention cleanup (keep last 10 tags + latest)
        shell: bash
        run: |
          set -euo pipefail

          KEEP=81
          REPO="${{ github.event.repository.name }}"

          echo "Starting unified cleanup (keeping last $KEEP digests + latest)"

          # Helper: build KEEP DIGEST SET
          declare -A KEEP_DIGESTS=()

          # 1. ACR - collect manifests
          echo "Processing ACR..."

          ACR_REG="${{ env.ACR_REGISTRY_NAME }}"

          # Get digests sorted by push time (newest first)
          mapfile -t ACR_DIGESTS < <(
            az acr manifest list-metadata \
              --registry "$ACR_REG" \
              --name "$REPO" \
              --orderby time_desc \
              --query "[].digest" \
              -o tsv
          )

          # Always keep latest KEEP digests
          for ((i=0; i<KEEP && i<${#ACR_DIGESTS[@]}; i++)); do
            KEEP_DIGESTS["${ACR_DIGESTS[$i]}"]=1
          done

          # Always keep latest tag digest
          LATEST_ACR_DIGEST=$(
            az acr manifest list-metadata \
              --registry "$ACR_REG" \
              --name "$REPO" \
              --query "[?tags[?name=='latest']].digest | [0]" \
              -o tsv || true
          )

          if [[ -n "$LATEST_ACR_DIGEST" ]]; then
            KEEP_DIGESTS["$LATEST_ACR_DIGEST"]=1
          fi


          # 2. ECR
          echo "Processing AWS Marketplace ECR..."
          ECR_REGISTRY_ID="709825985650"
          ECR_REPO="the-butler-group/caddy-ingress"

          mapfile -t ECR_DIGESTS < <(
            aws ecr describe-images \
              --registry-id "$ECR_REGISTRY_ID" \
              --repository-name "$ECR_REPO" \
              --query 'sort_by(imageDetails,& imagePushedAt)[].imageDigest' \
              --output text | tr '\t' '\n' | tac
          )

          for ((i=0; i<KEEP && i<${#ECR_DIGESTS[@]}; i++)); do
            KEEP_DIGESTS["${ECR_DIGESTS[$i]}"]=1
          done

          # Keep latest tag, if present
          LATEST_ECR_DIGEST=$(
            aws ecr describe-images \
              --registry-id "$ECR_REGISTRY_ID" \
              --repository-name "$ECR_REPO" \
              --query "imageDetails[?imageTags && contains(imageTags, \`latest\`)].imageDigest | [0]" \
              --output text || true
          )

          if [[ -n "$LATEST_ECR_DIGEST" && "$LATEST_ECR_DIGEST" != "None" ]]; then
            KEEP_DIGESTS["$LATEST_ECR_DIGEST"]=1
          fi


          # 3. GAR
          echo "Processing GAR..."

          GAR_LOCATION="us-docker.pkg.dev"
          GAR_PROJECT="containerbutler"
          GAR_REPO="caddy-ingress"

          GAR_IMAGES=(
            "$REPO"
            "deployer"
            "tester"
          )

          declare -A GAR_IMAGE_DIGESTS_BY_IMAGE=()

          for GAR_IMAGE in "${GAR_IMAGES[@]}"; do
            FULL_GAR_REPO="${GAR_LOCATION}/${GAR_PROJECT}/${GAR_REPO}/${GAR_IMAGE}"

            echo "Processing GAR image: $FULL_GAR_REPO"

            mapfile -t DIGESTS < <(
              gcloud artifacts docker images list "$FULL_GAR_REPO" \
                --sort-by=~UPDATE_TIME \
                --format="value(DIGEST)" || true
            )

            GAR_IMAGE_DIGESTS_BY_IMAGE["$GAR_IMAGE"]="$(printf '%s\n' "${DIGESTS[@]}")"

            for ((i=0; i<KEEP && i<${#DIGESTS[@]}; i++)); do
              KEEP_DIGESTS["${DIGESTS[$i]}"]=1
            done

            LATEST_DIGEST=$(
              gcloud artifacts docker images list "$FULL_GAR_REPO" \
                --filter="tags:latest" \
                --format="value(DIGEST)" \
                --limit=1 || true
            )

            if [[ -n "$LATEST_DIGEST" ]]; then
              KEEP_DIGESTS["$LATEST_DIGEST"]=1
            fi
          done


          # DELETE PASS (all registries)
          echo "Starting deletion pass..."

          # ACR delete
          for digest in "${ACR_DIGESTS[@]}"; do
            if [[ -z "${KEEP_DIGESTS[$digest]+x}" ]]; then
              echo "ACR delete: $digest"
              az acr repository delete \
                --name "$ACR_REG" \
                --image "${REPO}@${digest}" \
                --yes || true
            fi
          done

          # ECR delete
          for digest in "${ECR_DIGESTS[@]}"; do
            if [[ -z "${KEEP_DIGESTS[$digest]+x}" ]]; then
              echo "ECR delete: $digest"
              aws ecr batch-delete-image \
                --registry-id "$ECR_REGISTRY_ID" \
                --repository-name "$ECR_REPO" \
                --image-ids imageDigest="$digest" || true
            fi
          done

          # GAR delete
          for GAR_IMAGE in "${GAR_IMAGES[@]}"; do
            FULL_GAR_REPO="${GAR_LOCATION}/${GAR_PROJECT}/${GAR_REPO}/${GAR_IMAGE}"

            while IFS= read -r digest; do
              [[ -z "$digest" ]] && continue

              if [[ -z "${KEEP_DIGESTS[$digest]+x}" ]]; then
                echo "GAR delete: ${FULL_GAR_REPO}@${digest}"
                gcloud artifacts docker images delete \
                  "${FULL_GAR_REPO}@${digest}" \
                  --delete-tags \
                  --quiet || true
              fi
            done <<< "${GAR_IMAGE_DIGESTS_BY_IMAGE[$GAR_IMAGE]}"
          done

          echo "Cleanup complete."
