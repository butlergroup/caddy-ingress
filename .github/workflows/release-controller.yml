name: Release Controller

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACR_REGISTRY_NAME: containerbutler # example: "myRegistry".azurecr.io
  ACR_REPO_NAME: caddy-ingress # example: myRepo
  KEY_ID: https://computerbutler-keyvault.vault.azure.net/keys/container-signing-cert/6c774b9bf66a410b8e2a0a1e31e428c4 # example: https://mynotationakv.vault.azure.net/keys/notationLeafCert/c585b8ad8fc542b28e41e555d9b3a1fd
  NOTATION_EXPERIMENTAL: 1 # [Optional] when set, use Referrers API in the workflow (Recommended)

jobs:
  goreleaser:
    permissions:
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    name: GoReleaser Build, Push to GHCR & DockerHub, and sign
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.2
          check-latest: true
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64,s390x
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to DockerHub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 #v4.1.1
      - name: Check install!
        run: cosign version
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Get GoReleaser digest and sign the images with GitHub OIDC Token
        run: |
          DIGEST=$(cat dist/digests.txt | head -n 1 | awk '{print $2}')
          IMAGE="ghcr.io/sigstore/sample-honk"
          cosign sign --yes ${IMAGE}@${DIGEST}

  notation-sign:
    needs: goreleaser
    runs-on: ubuntu-latest
    name: Pull, Retag, Push To Azure Container Registry & Sign
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      # Log in to Azure with your service principal secret
      - name: Azure login
        uses: Azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      # If you are using OIDC and federated credential, make sure to replace the above step with below:
      # - name: Azure login
      #   uses: Azure/login@v3
      #   with:
      #     client-id: ${{ secrets.AZURE_CLIENT_ID }}
      #     tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #     subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Log in to your ACR registry
      - name: ACR login
        run: |
          az acr login --name ${{ env.ACR_REGISTRY_NAME }}
      # Log in to DockerHub 
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{
          secrets.DOCKER_USERNAME }}" --password-stdin
      # Sync from DockerHub to ACR
      - name: Copy multi-arch image to ACR
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          SOURCE=docker.io/butlergroup/caddy-ingress:$TAG
          TARGET=${{ env.ACR_REGISTRY_NAME }}.azurecr.io/${{ env.ACR_REPO_NAME }}:$TAG
          docker buildx imagetools create \
            --tag $TARGET \
            $SOURCE
      # Get the manifest digest of the OCI artifact
      - name: Retrieve digest
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          REPO=${{ env.ACR_REPO_NAME }}
          DIGEST=$(az acr repository show-manifests \
            --name ${{ env.ACR_REGISTRY_NAME }} \
            --repository $REPO \
            --query "[?tags[?@=='$TAG']].digest | [0]" \
            -o tsv)
          echo "target_artifact_reference=${{ env.ACR_REGISTRY_NAME }}.azurecr.io/$REPO@$DIGEST" >> $GITHUB_ENV
      # Install Notation CLI with the default version "1.0.0"
      - name: setup notation
        uses: notaryproject/notation-action/setup@v1
      # Sign your OCI artifact using private key stored in AKV
      - name: sign OCI artifact using key pair from AKV
        uses: notaryproject/notation-action/sign@v1
        with:
          plugin_name: azure-kv
          plugin_url: https://github.com/Azure/notation-azure-kv/releases/download/v1.2.1/notation-azure-kv_1.2.1_linux_amd64.tar.gz
          plugin_checksum: 2fc959bf850275246b044203609202329d015005574fabbf3e6393345e49b884
          key_id: ${{ env.KEY_ID }}
          target_artifact_reference: ${{ env.target_artifact_reference }}
          signature_format: cose
          plugin_config: |-
            self_signed=true
          # If you are using self-signed certificate from AKV, then the `plugin_config` should be:
          # plugin_config: |-
          #   self_signed=true
          # ca_certs=.github/cert-bundle/cert-bundle.crt
          allow_referrers_api: "true"
