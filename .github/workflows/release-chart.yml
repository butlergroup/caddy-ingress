name: Release Charts

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows:
      - Release Controller
    types:
      - completed

env:
  ACR_REGISTRY_NAME: containerbutler # example: "myRegistry" .azurecr.io
  ACR_REPO_NAME: ${{ github.event.repository.name }} # example: myRepo

jobs:
  release:
    permissions:
      contents: read
      packages: write
      id-token: write
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Log in to Azure with your service principal
      - name: Azure login
        uses: Azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      # Log in to your ACR registry
      - name: Login to Azure Container Registry (Docker)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: containerbutler.azurecr.io
          username: ${{ secrets.AZURE_CREDENTIALS_CLIENT_ID }}
          password: ${{ secrets.AZURE_CREDENTIALS_CLIENT_SECRET }}
      - name: Authenticate to Google Cloud
        uses: "google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093" # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Set up gCloud SDK
        uses: "google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db" # v3.0.1
      - name: Configure gcloud Docker for GAR
        run: |
          gcloud auth configure-docker \
            us-docker.pkg.dev \
            --quiet
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password \
            --region us-east-1 | \
          docker login \
            --username AWS \
            --password-stdin \
            709825985650.dkr.ecr.us-east-1.amazonaws.com
      - name: Package Helm chart
        run: |
          mkdir -p .cr-release-packages

          helm package charts/caddy-ingress-controller \
            --destination .cr-release-packages
      - name: Push Helm chart to GHCR
        run: |
          helm push .cr-release-packages/caddy-ingress-controller-*.tgz \
            oci://ghcr.io/butlergroup/caddy-ingress/charts
      - name: Push Helm chart to ACR
        run: |
          helm push .cr-release-packages/caddy-ingress-controller-*.tgz \
            oci://containerbutler.azurecr.io/charts
      - name: Push Helm chart to GAR
        run: |
          helm push .cr-release-packages/caddy-ingress-controller-*.tgz \
            oci://us-docker.pkg.dev/containerbutler/caddy-ingress/charts
      - name: Push Helm chart to ECR
        run: |
          helm push .cr-release-packages/caddy-ingress-controller-*.tgz \
            oci://709825985650.dkr.ecr.us-east-1.amazonaws.com/the-butler-group/${{ github.event.repository.name }}/charts
      - name: GHCR retention policy
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: caddy-ingress/charts/caddy-ingress-controller
          package-type: container
          min-versions-to-keep: 10
