{{- if .Values.loadBalancer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "caddy-ingress-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.loadBalancer.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "caddy-ingress-controller.labels" . | nindent 4 }}
    {{- with .Values.loadBalancer.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: "LoadBalancer"
  {{- if (semverCompare "<= 1.24.0" .Capabilities.KubeVersion.Version) }}
  loadBalancerIP: {{ .Values.loadBalancer.loadBalancerIP }} #Deprecated in Kubernetes v1.24
  {{- end }}
  loadBalancerSourceRanges: # Cloudflare IP ranges
    - 173.245.48.0/20
    - 103.21.244.0/22
    - 103.22.200.0/22
    - 103.31.4.0/22
    - 141.101.64.0/18
    - 108.162.192.0/18
    - 190.93.240.0/20
    - 188.114.96.0/20
    - 197.234.240.0/22
    - 198.41.128.0/17
    - 162.158.0.0/15
    - 104.16.0.0/13
    - 104.24.0.0/14
    - 172.64.0.0/13
    - 131.0.72.0/22
  externalTrafficPolicy: {{ .Values.loadBalancer.externalTrafficPolicy }}
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
    - name: https
      port: 443
      protocol: TCP
      targetPort: https
    - name: quic
      port: 443
      protocol: UDP
      targetPort: 443
  selector:
    {{- include "caddy-ingress-controller.selectorLabels" . | nindent 4 }}
{{- end }}
