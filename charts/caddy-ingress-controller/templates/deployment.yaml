apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "caddy-ingress-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "caddy-ingress-controller.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "caddy-ingress-controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        cloudmarketplace.googleapis.com/product.metadata: 'v1:{"services":[{"service_name":"{{ .Values.marketplace.serviceName }}","service_level":"{{ .Values.marketplace.serviceLevel }}"}]}'
        com.googleapis.cloudmarketplace.product.service.name: "{{ .Values.marketplace.serviceName }}"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "caddy-ingress-controller.selectorLabels" . | nindent 8 }}
        azure-extensions-usage-release-identifier: {{ .Release.Name }}
        {{- with .Values.ingressController.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "caddy-ingress-controller.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: '{{ include "caddy-ingress-controller.image" . }}'
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
              {{- if .Values.minikube }}
              hostPort: 80 # optional, required if running in minikube
              {{- end }}
            - name: https
              containerPort: 443
              protocol: TCP
              {{- if .Values.minikube }}
              hostPort: 443 # optional, required if running in minikube
              {{- end }}
            - name: quic
              containerPort: 443
              protocol: UDP
              {{- if .Values.minikube }}
              hostPort: 443 # optional, required if running in minikube
              {{- end }}
            - name: metrics
              containerPort: 9765
              protocol: TCP
              {{- if .Values.minikube }}
              hostPort: 9765 # optional, required if running in minikube
              {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.ingressController.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
          - name: tmp
            mountPath: /tmp
          args:
            - -config-map={{ include "caddy-ingress-controller.name" . }}-configmap
            {{- if .Values.ingressController.watchNamespace }}
            - -namespace={{ .Values.ingressController.watchNamespace }}
            {{- end }}
            {{- if .Values.ingressController.leaseId }}
            - -lease-id={{ .Values.ingressController.leaseId }}
            {{- end }}
            {{- if .Values.ingressController.verbose }}
            - -verbose
            {{- end }}
            {{- if .Values.ingressController.className }}
            - -class-name={{ .Values.ingressController.className }}
            {{- end }}
            {{- if .Values.ingressController.classNameRequired }}
            - -class-name-required={{ .Values.ingressController.classNameRequired }}
            {{- end }}
          readinessProbe:
            initialDelaySeconds: 3
            periodSeconds: 10
            httpGet:
              port: 9765
              path: /healthz
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: tmp
        emptyDir: {}
