apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "caddy-ingress-controller.name" . }}-configmap
  namespace: {{ .Release.Namespace }}
data:
{{- range $key, $value := .Values.ingressController.config }}
  {{- if kindIs "slice" $value }}
  {{ $key }}: {{ $value | toJson | quote }}
  {{- else }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}